settings:
  max_articles_per_feed: 20
  max_article_age_hours: 24
  target_digest_size: 12

categories:
  # --- TECH: Community-curated (highest signal) ---
  tech:
    weight: 0.4
    feeds:
      - name: Hacker News
        url: https://hnrss.org/best
        weight: 1.3
      - name: Lobsters
        url: https://lobste.rs/rss
        weight: 1.2

  # --- TECH: Journalism (deeper reporting) ---
  tech_journalism:
    weight: 0.15
    feeds:
      - name: Ars Technica
        url: https://feeds.arstechnica.com/arstechnica/index
        weight: 1.0
      - name: TechCrunch
        url: https://techcrunch.com/feed/
        weight: 0.8
      - name: The Verge
        url: https://www.theverge.com/rss/index.xml
        weight: 0.7
      - name: BBC Tech
        url: http://feeds.bbci.co.uk/news/technology/rss.xml
        weight: 0.7

  # --- SELF-HOSTING / HOMELAB ---
  selfhosted:
    weight: 0.1
    feeds:
      - name: Noted (selfhosted)
        url: https://noted.lol/rss/
        weight: 1.0
      - name: Awesome Selfhosted
        url: https://github.com/awesome-selfhosted/awesome-selfhosted/releases.atom
        weight: 0.9

  # --- SECURITY ---
  security:
    weight: 0.1
    feeds:
      - name: Krebs on Security
        url: https://krebsonsecurity.com/feed/
        weight: 1.2
      - name: Schneier on Security
        url: https://www.schneier.com/feed/
        weight: 1.1
      - name: The Hacker News
        url: https://feeds.feedburner.com/TheHackersNews
        weight: 1.0

  # --- SCIENCE & SPACE ---
  science:
    weight: 0.1
    feeds:
      - name: BBC Science
        url: http://feeds.bbci.co.uk/news/science_and_environment/rss.xml
        weight: 0.9
      - name: Phys.org
        url: https://phys.org/rss-feed/
        weight: 0.8
      - name: NASA Breaking News
        url: https://www.nasa.gov/news-release/feed/
        weight: 1.0

  # --- WORLD / USA ---
  world:
    weight: 0.15
    feeds:
      - name: Al Jazeera
        url: https://www.aljazeera.com/xml/rss/all.xml
        weight: 0.9
      - name: NPR
        url: https://feeds.npr.org/1001/rss.xml
        weight: 0.9
      - name: BBC World
        url: https://feeds.bbci.co.uk/news/world/rss.xml
        weight: 0.9
      - name: The Guardian World
        url: https://www.theguardian.com/world/rss
        weight: 0.8
